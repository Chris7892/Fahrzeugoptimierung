<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#003A70"/>

  <!-- Fahrerkabine (cab-over-Design, typisch für europäische LKW) -->
  <path d="M6 44
           L6 26
           Q6 22 10 22
           L20 22
           L20 44 Z"
        fill="#5B9BD5" stroke="#EAF1FA" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Frontscheibe -->
  <path d="M9 26 Q9 25 10 25 L17 25 L17 33 L9 33 Z"
        fill="#BEE1FF"/>

  <!-- Ladefläche / Kofferaufbau -->
  <rect x="20" y="16" width="36" height="28" fill="#D9D9D9" stroke="#EAF1FA" stroke-width="1.4"/>

  <!-- Stoßstange unten -->
  <rect x="6" y="44" width="50" height="3" rx="1" fill="#1F2937"/>

  <!-- Räder -->
  <circle cx="15" cy="49" r="6" fill="#1F2937" stroke="#EAF1FA" stroke-width="1.2"/>
  <circle cx="15" cy="49" r="2.3" fill="#9CA3AF"/>

  <circle cx="38" cy="49" r="6" fill="#1F2937" stroke="#EAF1FA" stroke-width="1.2"/>
  <circle cx="38" cy="49" r="2.3" fill="#9CA3AF"/>

  <circle cx="49" cy="49" r="6" fill="#1F2937" stroke="#EAF1FA" stroke-width="1.2"/>
  <circle cx="49" cy="49" r="2.3" fill="#9CA3AF"/>

  <!-- Scheinwerfer -->
  <rect x="6.5" y="35" width="3" height="5" rx="1" fill="#FFE29A"/>
</svg>
